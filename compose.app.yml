      NEWS_MAX_PENDING_ITEMS:
      NEWS_RSS_FEEDS_JSON:
      NEWS_USGS_ENABLED:
      NEWS_USGS_APPROVED:
      NEWS_USGS_LICENSE_VERSION:
      NEWS_USGS_PERMITTED_PRODUCERS:
      NEWS_USGS_URL:
      NEWS_FED_ENABLED:
      NEWS_FED_APPROVED:
      NEWS_FED_LICENSE_VERSION:
      NEWS_FED_PERMITTED_PRODUCERS:
      NEWS_FED_URL:
      NEWS_FED_ARTICLE_SELECTOR:
      NEWS_GDELT_ENABLED:
      NEWS_GDELT_APPROVED:
      NEWS_GDELT_LICENSE_VERSION:
      NEWS_GDELT_PERMITTED_PRODUCERS:
      NEWS_GDELT_URL:
      NEWS_DIGEST_ENABLED:
