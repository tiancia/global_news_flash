# Combine with mysql (local Docker database) or offline (local H2 file).
# Initial setup permits manual collection only; no client is called at startup.
news:
  runtime:
    mode: LIVE
    external-enabled: ${NEWS_EXTERNAL_ENABLED:true}
    preferred-provider: ${NEWS_AI_PROVIDER:deepseek}
  ingestion:
    enabled: ${NEWS_INGESTION_ENABLED:true}
    max-items-per-source: ${NEWS_MAX_ITEMS_PER_SOURCE:3}
    fed:
      enabled: ${NEWS_FED_ENABLED:true}
      approved: ${NEWS_FED_APPROVED:true}
      # Reviewed 2026-10-26: https://www.federalreserve.gov/disclaimer.htm
      # Board-authored announcement text only, with attribution and the source URL.
      # Excludes non-Board materials, photos, seals, logos and linked attachments.
      license-version: ${NEWS_FED_LICENSE_VERSION:fed-board-announcement-text-2026-10-26}
      permitted-producers: ${NEWS_FED_PERMITTED_PRODUCERS:federal-reserve-board}
  automation:
    policy-ready: ${NEWS_POLICY_READY:true}
    batch-size: ${NEWS_AUTOMATION_BATCH_SIZE:1}
