# Local infrastructure: docker compose up -d starts only this project's MySQL.
name: global-news-flash

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: global_news_flash
      MYSQL_USER: global_news_flash
      MYSQL_PASSWORD: ${NEWS_DB_PASSWORD:-123456}
      MYSQL_ROOT_PASSWORD: ${NEWS_DB_ROOT_PASSWORD:-123456}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - "A:/DockerData/global-news-flash/mysql:/var/lib/mysql"
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
