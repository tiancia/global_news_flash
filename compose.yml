# Deployment configuration only. Real MySQL migrations, image builds and deployment are not yet verified.
name: global-news-flash

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: global_news_flash
      MYSQL_USER: global_news_flash
      MYSQL_PASSWORD: ${NEWS_DB_PASSWORD:?Set NEWS_DB_PASSWORD in the process environment or local .env}
      MYSQL_ROOT_PASSWORD: ${NEWS_DB_ROOT_PASSWORD:?Set NEWS_DB_ROOT_PASSWORD in the process environment or local .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    # The database has no published host port and is private to this compose project.
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: global-news-flash:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NEWS_PORT:-8090}:${NEWS_PORT:-8090}"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      TZ: UTC
      # Listen on the container network; the host mapping above exposes ops only on loopback.
      NEWS_BIND_ADDRESS: 0.0.0.0
      NEWS_PORT: ${NEWS_PORT:-8090}
      NEWS_DB_URL: jdbc:mysql://db:3306/global_news_flash?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      NEWS_DB_USER: global_news_flash
      NEWS_DB_PASSWORD: ${NEWS_DB_PASSWORD:?Set NEWS_DB_PASSWORD in the process environment or local .env}
      NEWS_RUNTIME_MODE: ${NEWS_RUNTIME_MODE:-OFFLINE}
      NEWS_EXTERNAL_ENABLED: ${NEWS_EXTERNAL_ENABLED:-false}
      NEWS_OPS_TOKEN: ${NEWS_OPS_TOKEN:?Set an independent NEWS_OPS_TOKEN of at least 32 characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NEWS_OPENAI_TIMEOUT: ${NEWS_OPENAI_TIMEOUT:-45s}
      NEWS_OPENAI_MAX_INPUT_CHARACTERS: ${NEWS_OPENAI_MAX_INPUT_CHARACTERS:-24000}
      NEWS_OPENAI_MAX_OUTPUT_TOKENS: ${NEWS_OPENAI_MAX_OUTPUT_TOKENS:-1800}
      NEWS_OPENAI_INPUT_MICROS_PER_MILLION_TOKENS: ${NEWS_OPENAI_INPUT_MICROS_PER_MILLION_TOKENS:-0}
      NEWS_OPENAI_OUTPUT_MICROS_PER_MILLION_TOKENS: ${NEWS_OPENAI_OUTPUT_MICROS_PER_MILLION_TOKENS:-0}
      NEWS_TELEGRAM_ENABLED: ${NEWS_TELEGRAM_ENABLED:-false}
      NEWS_TELEGRAM_BOT_TOKEN: ${NEWS_TELEGRAM_BOT_TOKEN:-}
      NEWS_TELEGRAM_CHAT_ID: ${NEWS_TELEGRAM_CHAT_ID:-}
      NEWS_TELEGRAM_CONNECT_TIMEOUT: ${NEWS_TELEGRAM_CONNECT_TIMEOUT:-5s}
      NEWS_TELEGRAM_REQUEST_TIMEOUT: ${NEWS_TELEGRAM_REQUEST_TIMEOUT:-15s}
      NEWS_PUBLICATION_WORKER_ENABLED: ${NEWS_PUBLICATION_WORKER_ENABLED:-false}
      NEWS_PUBLICATION_WORKER_DELAY_MS: ${NEWS_PUBLICATION_WORKER_DELAY_MS:-5000}
      NEWS_PUBLICATION_LEASE: ${NEWS_PUBLICATION_LEASE:-2m}
      NEWS_PUBLICATION_MAX_ATTEMPTS: ${NEWS_PUBLICATION_MAX_ATTEMPTS:-3}
      NEWS_PUBLICATION_MAX_PER_HOUR: ${NEWS_PUBLICATION_MAX_PER_HOUR:-6}
      NEWS_PUBLICATION_MAX_PER_DAY: ${NEWS_PUBLICATION_MAX_PER_DAY:-24}
      NEWS_PUBLICATION_MINIMUM_INTERVAL: ${NEWS_PUBLICATION_MINIMUM_INTERVAL:-5m}
      NEWS_AUTOMATION_ENABLED: ${NEWS_AUTOMATION_ENABLED:-false}
      NEWS_AUTOMATION_DELAY_MS: ${NEWS_AUTOMATION_DELAY_MS:-60000}
      NEWS_AUTOMATION_INITIAL_DELAY_MS: ${NEWS_AUTOMATION_INITIAL_DELAY_MS:-10000}
      NEWS_POLICY_READY: ${NEWS_POLICY_READY:-false}
      NEWS_POLICY_VERSION: ${NEWS_POLICY_VERSION:-initial-v1}
      NEWS_MAX_AGE: ${NEWS_MAX_AGE:-12h}
      NEWS_MAX_CHARACTERS: ${NEWS_MAX_CHARACTERS:-3000}
      NEWS_MINIMUM_INDEPENDENT_CHAINS: ${NEWS_MINIMUM_INDEPENDENT_CHAINS:-1}
      NEWS_ALLOWED_TOPICS: ${NEWS_ALLOWED_TOPICS:-EARTHQUAKE,OFFICIAL_ANNOUNCEMENT,WORLD,ECONOMY,SCIENCE,TECHNOLOGY}
      NEWS_AUTOMATION_BATCH_SIZE: ${NEWS_AUTOMATION_BATCH_SIZE:-10}
      NEWS_DAILY_BUDGET_MICROS: ${NEWS_DAILY_BUDGET_MICROS:-1000000}
      NEWS_DAILY_REQUESTS: ${NEWS_DAILY_REQUESTS:-100}
      NEWS_EDITOR_JOB_LEASE: ${NEWS_EDITOR_JOB_LEASE:-3m}
      NEWS_CYCLE_LEASE: ${NEWS_CYCLE_LEASE:-15m}
      NEWS_REVISION_MODE: ${NEWS_REVISION_MODE:-HOLD}
      NEWS_INGESTION_ENABLED: ${NEWS_INGESTION_ENABLED:-false}
      NEWS_INGESTION_POLL_DELAY_MS: ${NEWS_INGESTION_POLL_DELAY_MS:-60000}
      NEWS_SOURCE_POLL_INTERVAL_MS: ${NEWS_SOURCE_POLL_INTERVAL_MS:-300000}
      NEWS_MAX_SOURCES_PER_POLL: ${NEWS_MAX_SOURCES_PER_POLL:-10}
      NEWS_MAX_ITEMS_PER_SOURCE: ${NEWS_MAX_ITEMS_PER_SOURCE:-20}
      NEWS_MAX_BODY_CHARACTERS: ${NEWS_MAX_BODY_CHARACTERS:-16000}
      NEWS_MINIMUM_BODY_CHARACTERS: ${NEWS_MINIMUM_BODY_CHARACTERS:-200}
      NEWS_SOURCE_REQUEST_TIMEOUT_SECONDS: ${NEWS_SOURCE_REQUEST_TIMEOUT_SECONDS:-15}
      NEWS_SOURCE_MAX_RESPONSE_BYTES: ${NEWS_SOURCE_MAX_RESPONSE_BYTES:-1000000}
      NEWS_SOURCE_LEASE_SECONDS: ${NEWS_SOURCE_LEASE_SECONDS:-900}
      NEWS_INBOX_LEASE_SECONDS: ${NEWS_INBOX_LEASE_SECONDS:-900}
      NEWS_MAX_PENDING_ITEMS: ${NEWS_MAX_PENDING_ITEMS:-2000}
      NEWS_RSS_FEEDS_JSON: ${NEWS_RSS_FEEDS_JSON:-[]}
      NEWS_USGS_ENABLED: ${NEWS_USGS_ENABLED:-false}
      NEWS_USGS_APPROVED: ${NEWS_USGS_APPROVED:-false}
      NEWS_USGS_LICENSE_VERSION: ${NEWS_USGS_LICENSE_VERSION:-pending}
      NEWS_USGS_PERMITTED_PRODUCERS: ${NEWS_USGS_PERMITTED_PRODUCERS:-}
      NEWS_USGS_URL: ${NEWS_USGS_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_day.geojson}
      NEWS_FED_ENABLED: ${NEWS_FED_ENABLED:-false}
      NEWS_FED_APPROVED: ${NEWS_FED_APPROVED:-false}
      NEWS_FED_LICENSE_VERSION: ${NEWS_FED_LICENSE_VERSION:-pending}
      NEWS_FED_PERMITTED_PRODUCERS: ${NEWS_FED_PERMITTED_PRODUCERS:-}
      NEWS_FED_URL: ${NEWS_FED_URL:-https://www.federalreserve.gov/feeds/press_all.xml}
      NEWS_FED_ARTICLE_SELECTOR: ${NEWS_FED_ARTICLE_SELECTOR:-#article}
      NEWS_GDELT_ENABLED: ${NEWS_GDELT_ENABLED:-false}
      NEWS_GDELT_APPROVED: ${NEWS_GDELT_APPROVED:-false}
      NEWS_GDELT_LICENSE_VERSION: ${NEWS_GDELT_LICENSE_VERSION:-pending}
      NEWS_GDELT_PERMITTED_PRODUCERS: ${NEWS_GDELT_PERMITTED_PRODUCERS:-}
      NEWS_GDELT_URL: ${NEWS_GDELT_URL:-}
      NEWS_DIGEST_ENABLED: ${NEWS_DIGEST_ENABLED:-false}
      NEWS_DIGEST_UTC_HOUR: ${NEWS_DIGEST_UTC_HOUR:-22}
      NEWS_DIGEST_MAX_ITEMS: ${NEWS_DIGEST_MAX_ITEMS:-5}
      NEWS_DIGEST_MAX_CHARACTERS: ${NEWS_DIGEST_MAX_CHARACTERS:-3000}
      NEWS_ALERT_ENABLED: ${NEWS_ALERT_ENABLED:-false}
      NEWS_ALERT_WEBHOOK_URL: ${NEWS_ALERT_WEBHOOK_URL:-}
      NEWS_ALERT_WEBHOOK_TOKEN: ${NEWS_ALERT_WEBHOOK_TOKEN:-}
      NEWS_ALERT_TIMEOUT: ${NEWS_ALERT_TIMEOUT:-10s}
      NEWS_ALERT_DELAY_MS: ${NEWS_ALERT_DELAY_MS:-60000}
    logging: *bounded-logging
    stop_grace_period: 45s

volumes:
  mysql-data:
